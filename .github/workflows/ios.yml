name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode and a simulator
        run: |
          # Use the newest Xcode on the runner, so code behind newer-SDK checks is compiled too.
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          import re
          phones = [(runtime, d) for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          # Newest iOS first, then the newest standard-size iPhone ("iPhone 17", not Pro Max or SE).
          def rank(p):
              version = [int(n) for n in p[0].split("iOS-")[-1].split("-")]
              model = re.fullmatch(r"iPhone (\d+)", p[1]["name"])
              return (version, int(model.group(1)) if model else 0)
          runtime, device = max(phones, key=rank)
          print(device["udid"])
          sys.stderr.write("Using %s on %s\n" % (device["name"], runtime))
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Strata.xcodeproj -scheme Strata \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build | xcbeautify --renderer github-actions | tee results-build.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Strata.xcodeproj -scheme Strata \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -only-testing:StrataTests \
            -resultBundlePath results/unit.xcresult | xcbeautify --renderer github-actions

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Strata.xcodeproj -scheme Strata \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -only-testing:StrataUITests \
            -resultBundlePath results/ui.xcresult | xcbeautify --renderer github-actions | tee results-ui.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d results/ui.xcresult ]; then
            xcrun xcresulttool export attachments --path results/ui.xcresult --output-path screenshots > /dev/null || true
          fi
          ls screenshots | wc -l

      # Put "[screenshots]" in a commit message to refresh the images the README shows.
      - name: Commit README screenshots
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]')
        run: |
          if [ ! -f screenshots/manifest.json ]; then echo "No screenshots this run."; exit 0; fi
          python3 - <<'PY'
          import json, os, re, shutil, subprocess
          found = {}
          def walk(node):
              if isinstance(node, dict):
                  name, file = node.get("suggestedHumanReadableName"), node.get("exportedFileName")
                  if name and file and file.endswith(".png"):
                      found[re.sub(r"_\d+_[0-9A-F-]{36}\.png$", "", name)] = file
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(json.load(open("screenshots/manifest.json")))
          shutil.rmtree("docs/screenshots", ignore_errors=True)
          os.makedirs("docs/screenshots", exist_ok=True)
          for name, file in sorted(found.items()):
              target = f"docs/screenshots/{name}.png"
              shutil.copyfile(f"screenshots/{file}", target)
              subprocess.run(["sips", "-Z", "1400", target], check=True, stdout=subprocess.DEVNULL)
              print(target)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git diff --cached --quiet || git commit -m "Update Strata screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if [ -f results-build.log ]; then
            grep -A 3 -E "error" results-build.log | tail -n 40 || true
          fi
          if [ -f results-ui.log ]; then
            grep -E "✔|✖|error|Executed [0-9]+ tests" results-ui.log | tail -n 30 || true
          fi
